<html>
<head>
<style>
    /* xhtml2pdf only understands basic CSS, so this page stays plain (no Bootstrap) */
    body { font-family: Helvetica, sans-serif; font-size: 11px; color: #333; }
    h1 { font-size: 18px; margin-bottom: 0; }
    h2 { font-size: 14px; margin-top: 20px; margin-bottom: 0; }
    p.sub { color: #777; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background-color: #f4f4f4; }
</style>
</head>
<body>

    <h1>Staff Headcount Report</h1>
    <p class="sub">Total staff: {{ total_staff }}</p>

    <h2>By Department</h2>
    <table>
        <thead>
            <tr>
                <th>Department</th>
                <th>Staff Count</th>
            </tr>
        </thead>
        <tbody>
            {% for row in department_stats %}
            <tr>
                <td>{{ row.label }}</td>
                <td>{{ row.count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h2>By Role</h2>
    <table>
        <thead>
            <tr>
                <th>Role</th>
                <th>Staff Count</th>
            </tr>
        </thead>
        <tbody>
            {% for row in role_stats %}
            <tr>
                <td>{{ row.label }}</td>
                <td>{{ row.count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
