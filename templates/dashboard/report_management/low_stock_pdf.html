<html>
<head>
<style>
    /* xhtml2pdf only understands basic CSS, so this page stays plain (no Bootstrap) */
    body { font-family: Helvetica, sans-serif; font-size: 11px; color: #333; }
    h1 { font-size: 18px; margin-bottom: 0; }
    p.sub { color: #777; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background-color: #f4f4f4; }
</style>
</head>
<body>

    <h1>Low Stock Report</h1>
    <p class="sub">Medicines at or below their reorder level</p>

    <table>
        <thead>
            <tr>
                <th>Medicine</th>
                <th>Category</th>
                <th>Current Stock</th>
                <th>Reorder Level</th>
            </tr>
        </thead>
        <tbody>
            {% for medicine in low_stock_medicines %}
            <tr>
                <td>{{ medicine.name }}</td>
                <td>{{ medicine.get_category_display }}</td>
                <td>{{ medicine.total_quantity }}</td>
                <td>{{ medicine.reorder_level }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
